<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Patient History | AI MedCare</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body class="bg-light">

<div class="container py-5">

<h1 class="text-center mb-5">

<i class="fa-solid fa-clock-rotate-left"></i>

Patient History

</h1>

<div class="card shadow">

<div class="card-body">

<div class="row mb-4">

<div class="col-md-8">

<input
type="text"
id="searchInput"
class="form-control"
placeholder="Search patient by name...">

</div>

<div class="col-md-4 text-end">

<a href="/dashboard" class="btn btn-primary me-2">
    <i class="fa-solid fa-chart-line"></i>
    Dashboard
</a>

<a href="/logout" class="btn btn-danger">
    <i class="fa-solid fa-right-from-bracket"></i>
    Logout
</a>

</div>

</div>

<div class="table-responsive">

<table class="table table-hover table-bordered" id="historyTable">

<thead class="table-dark">

<tr>

<th>ID</th>
<th>Name</th>
<th>Age</th>
<th>Gender</th>
<th>Risk</th>
<th>Status</th>
<th>Action</th>

</tr>

</thead>

<tbody>

{% for patient in patients %}

<tr>

<td>{{ patient.id }}</td>

<td>{{ patient.name }}</td>

<td>{{ patient.age }}</td>

<td>{{ patient.gender }}</td>

<td>{{ patient.risk }}%</td>

<td>

{% if patient.prediction=="High Risk" %}

<span class="badge bg-danger">

High Risk

</span>

{% else %}

<span class="badge bg-success">

Low Risk

</span>

{% endif %}

</td>

<td>

<a href="/delete/{{ patient.id }}"
class="btn btn-danger btn-sm"
onclick="return confirm('Are you sure you want to delete this record?')">

<i class="fa-solid fa-trash"></i>

</a>

</td>

</tr>

{% endfor %}

</tbody>

</table>

</div>

</div>

</div>

</div>

<script>

const searchInput=document.getElementById("searchInput");

searchInput.addEventListener("keyup",function(){

let filter=this.value.toLowerCase();

let rows=document.querySelectorAll("#historyTable tbody tr");

rows.forEach(function(row){

let name=row.cells[1].innerText.toLowerCase();

if(name.includes(filter)){

row.style.display="";

}

else{

row.style.display="none";

}

});

});

</script>

</body>
</html>
